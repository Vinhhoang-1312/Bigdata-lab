name: urbanflow

x-spark-image: &spark-image urbanflow/spark-ml:4.2.0-python3
x-spark-build: &spark-build
  context: ./docker/spark-ml
x-spark-common: &spark-common
  image: *spark-image
  build: *spark-build
  restart: unless-stopped
  environment:
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Copy .env.example to .env}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Copy .env.example to .env}
    AWS_REGION: us-east-1
    PYTHONPATH: /workspace/urbanflow-batch:/workspace/urbanflow-replay:/workspace/urbanflow-streaming:/workspace/urbanflow-ml
    SPARK_MASTER_OPTS: -Dspark.worker.timeout=600
  volumes:
    - ./:/workspace:ro
  networks:
    - urbanflow

services:
  foundation-check:
    image: python:3.13.11-slim-bookworm
    working_dir: /workspace/urbanflow-foundation
    network_mode: none
    volumes:
      - ./:/workspace:ro
    command: ["python", "checks/validate_contract_fixtures.py"]
    profiles: ["tools"]

  batch-python:
    image: python:3.13.11-slim-bookworm
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /workspace
    volumes:
      - ./:/workspace:ro
      - "${URBANFLOW_SOURCE_DIR:-D:/UrbanFlow/nyc-tlc}:/workspace/local-data/nyc-tlc"
    networks:
      - urbanflow
    command:
      - python
      - /workspace/urbanflow-batch/batch/source_acquisition.py
      - --period
      - 2023-01
      - --period
      - 2023-02
    profiles: ["tools"]

  seaweedfs:
    build:
      context: ./docker/seaweedfs
    image: urbanflow/seaweedfs:4.45
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Copy .env.example to .env}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Copy .env.example to .env}
    command: ["server", "-dir=/data", "-s3", "-s3.config=/run/urbanflow/s3.json"]
    ports:
      - "8333:8333"
      - "8888:8888"
      - "9333:9333"
    volumes:
      - seaweed-data:/data
    networks:
      - urbanflow
    healthcheck:
      test: ["CMD-SHELL", "curl -sS -o /dev/null http://localhost:8333/"]
      interval: 5s
      timeout: 3s
      retries: 30

  bucket-init:
    image: amazon/aws-cli:2.36.40
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Copy .env.example to .env}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Copy .env.example to .env}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        aws --endpoint-url http://seaweedfs:8333 s3api head-bucket --bucket urbanflow 2>/dev/null ||
        aws --endpoint-url http://seaweedfs:8333 s3api create-bucket --bucket urbanflow
    networks:
      - urbanflow
    restart: "no"

  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9094:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - urbanflow
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 1g
    cpus: 1.5

  kafka-topic-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists --topic urbanflow.trip-events \
          --partitions 4 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists --topic urbanflow.trip-events.smoke-invalid \
          --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --describe --topic urbanflow.trip-events
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --describe --topic urbanflow.trip-events.smoke-invalid
    networks:
      - urbanflow
    restart: "no"

  replay-python:
    build:
      context: .
      dockerfile: docker/replay/Dockerfile
    image: urbanflow/replay:python3.13
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /workspace
    depends_on:
      kafka:
        condition: service_healthy
      kafka-topic-init:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Copy .env.example to .env}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Copy .env.example to .env}
      AWS_REGION: us-east-1
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PYTHONPATH: /workspace/urbanflow-replay
    volumes:
      - ./:/workspace
    networks:
      - urbanflow
    command: ["python", "/workspace/urbanflow-replay/tests/run_contract_tests.py"]
    mem_limit: 1g
    cpus: 2.0
    profiles: ["tools"]

  kafka-cli:
    image: apache/kafka:3.9.1
    depends_on:
      kafka-topic-init:
        condition: service_completed_successfully
    networks:
      - urbanflow
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:9092"]
    command: ["--describe", "--topic", "urbanflow.trip-events"]
    profiles: ["tools"]

  spark-master:
    <<: *spark-common
    hostname: spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "7077:7077"
      - "8080:8080"
    mem_limit: 640m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/json/ >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30

  spark-worker-1:
    <<: *spark-common
    hostname: spark-worker-1
    depends_on:
      spark-master:
        condition: service_healthy
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - --cores
      - "1"
      - --memory
      - 1536m
      - --webui-port
      - "8081"
      - spark://spark-master:7077
    ports:
      - "8081:8081"
    volumes:
      - ./:/workspace:ro
    mem_limit: 2g
    cpus: 2.0

  spark-worker-2:
    <<: *spark-common
    hostname: spark-worker-2
    depends_on:
      spark-master:
        condition: service_healthy
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - --cores
      - "1"
      - --memory
      - 1536m
      - --webui-port
      - "8082"
      - spark://spark-master:7077
    ports:
      - "8082:8082"
    volumes:
      - ./:/workspace:ro
    mem_limit: 2g
    cpus: 2.0

  streaming-api:
    image: *spark-image
    working_dir: /workspace/urbanflow-streaming
    entrypoint: ["/usr/bin/python3", "-m", "uvicorn"]
    command: ["serving.app:app", "--host", "0.0.0.0", "--port", "8001"]
    restart: unless-stopped
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Copy .env.example to .env}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Copy .env.example to .env}
      AWS_REGION: us-east-1
      PYTHONPATH: /workspace/urbanflow-streaming
      URBANFLOW_S3_ENDPOINT: http://seaweedfs:8333
      URBANFLOW_HISTORICAL_PATH: s3a://urbanflow/gold/historical_zone_baseline/
      URBANFLOW_LIVE_PATH: s3a://urbanflow/gold/live_zone_metrics/task6/stream_health_20260920_001/
      URBANFLOW_ZONE_LOOKUP_PATH: s3a://urbanflow/bronze/zone_lookup/taxi_zone_lookup.csv
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./:/workspace:ro
    networks:
      - urbanflow
    mem_limit: 640m

  ml-api:
    image: *spark-image
    working_dir: /workspace/urbanflow-ml
    entrypoint: ["/usr/bin/python3", "-m", "uvicorn"]
    command: ["ml_serving.app:app", "--host", "0.0.0.0", "--port", "8002"]
    restart: unless-stopped
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Copy .env.example to .env}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Copy .env.example to .env}
      AWS_REGION: us-east-1
      PYTHONPATH: /workspace/urbanflow-ml
      URBANFLOW_S3_ENDPOINT: http://seaweedfs:8333
      URBANFLOW_ML_CONFIG: /workspace/urbanflow-ml/config/settings.example.yaml
      URBANFLOW_ML_RUN_ID: gtqn-20260917-001
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - ./:/workspace:ro
    networks:
      - urbanflow
    mem_limit: 1536m

  spark-submit:
    image: *spark-image
    build: *spark-build
    user: root
    working_dir: /workspace
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Copy .env.example to .env}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Copy .env.example to .env}
      AWS_REGION: us-east-1
      PYTHONPATH: /workspace/urbanflow-batch:/workspace/urbanflow-replay:/workspace/urbanflow-streaming:/workspace/urbanflow-ml
    volumes:
      - ./:/workspace
      - "${URBANFLOW_SOURCE_DIR:-D:/UrbanFlow/nyc-tlc}:/workspace/local-data/nyc-tlc:ro"
      - spark-ivy:/root/.ivy2
    networks:
      - urbanflow
    entrypoint:
      - /opt/spark/bin/spark-submit
      - --conf
      - spark.jars.ivy=/root/.ivy2
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.13:4.2.0,org.apache.hadoop:hadoop-aws:3.5.0
      - --conf
      - spark.sql.session.timeZone=America/New_York
      - --conf
      - spark.network.timeout=600s
      - --conf
      - spark.executor.heartbeatInterval=30s
      - --conf
      - spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
      - --conf
      - spark.hadoop.fs.s3a.endpoint=http://seaweedfs:8333
      - --conf
      - spark.hadoop.fs.s3a.path.style.access=true
      - --conf
      - spark.hadoop.fs.s3a.connection.ssl.enabled=false
    command: ["--master", "local[2]", "/workspace/tests/infrastructure/spark_s3a_smoke.py"]
    ports:
      - "4040:4040"
    mem_limit: 3g
    cpus: 2.0
    profiles: ["tools"]

  aws:
    image: amazon/aws-cli:2.36.40
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Copy .env.example to .env}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Copy .env.example to .env}
      AWS_DEFAULT_REGION: us-east-1
    networks:
      - urbanflow
    entrypoint: ["aws", "--endpoint-url", "http://seaweedfs:8333"]
    command: ["s3api", "list-buckets"]
    profiles: ["tools"]

networks:
  urbanflow:
    name: urbanflow-net

volumes:
  seaweed-data:
  spark-ivy:
  kafka-data:
