[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "urbanflow-ml"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.2.6",
    "pyarrow==21.0.0",
    "PyYAML==6.0.3",
    "torch==2.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["forecasting*"]
