[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "urbanflow-streaming"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
offline = ["pyspark>=3.5,<4.3", "pytest>=8", "pandas>=2.2,<3", "pyarrow>=17"]
streaming = ["pyspark>=3.5,<4.3"]
analytics = ["streamlit>=1.40", "pandas>=2.2,<3", "pyarrow>=17", "s3fs>=2024.9", "pydeck>=0.9", "altair>=5.4"]
serving = ["fastapi==0.116.1", "uvicorn==0.35.0"]
dev = ["pytest>=8", "ruff>=0.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["analytics_app*", "spark*"]
exclude = ["config*", "output*", "tests*"]

[tool.ruff]
line-length = 100
