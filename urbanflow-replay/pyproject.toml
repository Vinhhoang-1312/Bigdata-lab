[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "urbanflow-replay"
version = "1.0.0"
description = "UrbanFlow historical Silver trip replay to Kafka"
requires-python = ">=3.11"
dependencies = [
  "confluent-kafka>=2.6,<3",
  "pyarrow>=17,<26",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
urbanflow-replay = "producer.replay_trips:main"

[tool.setuptools]
packages = ["producer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
